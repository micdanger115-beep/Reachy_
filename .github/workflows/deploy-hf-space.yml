name: Deploy to Hugging Face Space

on:
  push:
    branches:
      - main
      - claude/laughing-bell-3sxhsv
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hf-space
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build (in CI, damit HF nicht bauen muss -> keine HF-Credits noetig)
        run: |
          npm ci
          npm run build

      - name: Space-README neben die gebauten Dateien schreiben (statisch, ohne Build)
        run: |
          cat > dist/README.md <<'MD'
          ---
          title: Reachy Telefon
          emoji: "📞"
          colorFrom: blue
          colorTo: green
          sdk: static
          app_file: index.html
          pinned: false
          hf_oauth: true
          hf_oauth_expiration_minutes: 43200
          short_description: Reachy Mini als Gegensprech-Telefon mit Kopfsteuerung.
          tags:
            - reachy_mini
            - reachy_mini_js_app
          ---

          Vorgebaute statische App. Der Build laeuft in GitHub Actions; hier liegen
          nur die fertigen Dateien, daher braucht der Space keinen (kostenpflichtigen)
          Build-Schritt.
          MD

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upload prebuilt dist to Space
        env:
          # In GitHub: Settings -> Secrets and variables -> Actions
          #   Secret   HF_TOKEN  = dein HF-Write-Token (Pflicht)
          #   Variable HF_SPACE  = Space-Name (optional, Standard: reachy-telefon)
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning::HF_TOKEN-Secret ist noch nicht gesetzt. Deploy uebersprungen."
            exit 0
          fi
          pip install -U "huggingface_hub>=0.25"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          space = os.environ.get("HF_SPACE") or "reachy-telefon"
          api = HfApi(token=token)
          user = api.whoami()["name"]
          repo_id = f"{user}/{space}"

          # Space bei Bedarf anlegen (idempotent), als statischer Space.
          api.create_repo(
              repo_id=repo_id,
              repo_type="space",
              space_sdk="static",
              exist_ok=True,
          )

          # Nur die fertig gebauten Dateien hochladen. delete_patterns raeumt
          # alte Inhalte (z. B. eine frueher hochgeladene Quell-README mit
          # Build-Befehl) weg, damit HF keinen Build mehr ausloest.
          api.upload_folder(
              folder_path="dist",
              repo_id=repo_id,
              repo_type="space",
              commit_message="Deploy prebuilt static app from GitHub Actions",
              delete_patterns=["*"],
          )

          print(f"::notice::Space aktualisiert: https://huggingface.co/spaces/{repo_id}")
          print(f"::notice::App-URL: https://{user}-{space}.hf.space")
          PY
